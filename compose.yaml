name: ortak-akil
services:
  n8n:
    build:
      context: .
      dockerfile: deployment/n8n.Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    ports:
      - "127.0.0.1:${N8N_EDITOR_PORT:-5680}:5678"
    environment:
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_LOG_LEVEL: warn
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_EDITOR_PORT:-5680}
      WEBHOOK_URL: http://localhost:${N8N_EDITOR_PORT:-5680}/
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_PRUNE: "true"
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
    volumes:
      - n8n_data:/home/node/.n8n
      - internal_access:/run/ortak-akil
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5689/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
  ui:
    build:
      context: .
      dockerfile: deployment/ui.Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      APP_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-3000},http://127.0.0.1:${APP_PORT:-3000}
      INTERNAL_TOKEN_FILE: /run/ortak-akil/token
      HISTORY_DB_PATH: /app/history/evaluations.sqlite
      SETUP_SERVICE_URL: http://n8n:5689
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GOOGLE_DOCS_ENABLED: ${GOOGLE_DOCS_ENABLED:-false}
      N8N_EDITOR_URL: http://localhost:${N8N_EDITOR_PORT:-5680}
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30
    volumes:
      - internal_access:/run/ortak-akil:ro
      - evaluation_history:/app/history
    depends_on:
      n8n:
        condition: service_healthy
volumes:
  n8n_data:
  internal_access:
  evaluation_history:
